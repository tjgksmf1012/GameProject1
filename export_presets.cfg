; NIGHTSHIFT 내보내기 프리셋.
;
; **에디터에서만 존재하는 설정을 만들지 않는다** (CLAUDE.md 1.2) — 그래서 이 파일은
; 저장소에 들어가고, 빌드는 명령 한 줄로 재현된다:
;
;   godot --headless --export-release "Linux" build/nightshift.x86_64
;   godot --headless --export-release "Windows" build/nightshift.exe
;
; 필터 두 개 다 실제로 내보내 보고 확인했다.
;
; include_filter 의 *.json 은 **보험이다.** 처음엔 "JSON은 임포트 대상이 아니라
; 빼먹으면 수칙 0개짜리 게임이 나간다"고 적었는데, 필터를 지우고 내보내 봤더니
; all_resources 만으로도 들어갔다. 확인 없이 적은 근거는 틀렸다. 남겨는 두되
; 이유는 정확히 적는다 — Godot이 JSON을 어떻게 다루는지 바뀔 수 있으므로.
;
; exclude_filter 는 `tools/*` 형태도 `res://tools/*` 형태도 동작한다. 확인 방법이 중요하다:
; **바이너리를 문자열로 뒤지지 말 것.** PCK가 압축돼 있어서 같은 파일의 어떤 문자열은
; 찾아지고 어떤 문자열은 안 찾아진다. 그 착시 때문에 "res:// 접두어가 필수"라는
; 틀린 결론을 두 번 냈다. 경로 문자열은 uid_cache 에도 남아서 더 헷갈린다.
;
; 확실한 방법은 **빌드에게 직접 묻는 것**이다:
;   ./nightshift.x86_64 --headless -- --selftest
; systems/build_check.gd 가 내보낸 빌드 안에서 FileAccess 로 확인하고 보고한다.
;
; 여기서 지키려는 것: `tools/solver_audit.gd` 에는 **어느 수칙이 거짓인지 전부 적혀 있다.**
; 퍼즐 게임에서 그건 정답지를 같이 파는 것이다.

